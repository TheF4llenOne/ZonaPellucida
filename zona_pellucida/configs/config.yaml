# Configuration of the zona pellucida FCN experiments.
# The command-line runner reads a copy of this file. The notebook sets some
# values in its first cell and can override the others through
# CONFIG_OVERRIDES (except experiments.runs: it always trains both runs).

# Deep-learning framework: pytorch (PyTorch Lightning) or keras
# (TensorFlow/Keras, as used for the thesis). Everything else is shared.
framework: pytorch
# Single seed for every source of randomness (split, weight init, dropout,
# shuffling). Each figure cell of the notebook draws its images from its own
# generator seeded from it.
seed: 42
# Deterministic ops (PyTorch: torch.use_deterministic_algorithms, Keras:
# tf.config.experimental.enable_op_determinism). If an op has no
# deterministic GPU kernel, training stops and names the op; it is never
# disabled silently.
deterministic_ops: true
# Models, histories, figures and CSV files are written here (the command-line
# runner adds a sub-folder per framework).
output_dir: outputs

data:
  image_dir: /content/drive/MyDrive/g_embryos_dataset/images
  mask_dir: /content/drive/MyDrive/g_embryos_dataset/masks
  # Regexes with the named groups `sample` (embryo id) and `frame` (time
  # point in hours): embryo208_25h.png is embryo P08 of dish 2 at 25 h, its
  # mask embryo208_25h_mask.png. Images and masks are paired on (sample,
  # frame), never on list position. The 205 video frames of the first
  # thesis version: '^sample(?P<sample>\d+)_frame_(?P<frame>\d+)\.png$' and
  # '^sample(?P<sample>\d+)_mask_frame_(?P<frame>\d+)\.png$'.
  image_pattern: '^embryo(?P<sample>\d+)_(?P<frame>\d+)h\.png$'
  mask_pattern: '^embryo(?P<sample>\d+)_(?P<frame>\d+)h_mask\.png$'
  size: 512
  # Masks are scaled to [0, 1] and binarised with `> mask_threshold`.
  mask_threshold: 0.5

split:
  # Fraction of the embryos (without grouping: of all pairs) held out for
  # testing: 6 of the 30 embryos.
  test_size: 0.2
  # Fraction of the remaining embryos (pairs) used for validation (5 of 24),
  # i.e. choice of the kept epoch (and early stopping, if enabled) and
  # threshold selection. 0 disables validation.
  val_size: 0.2
  # true: whole embryos go to one subset, so all time points of an embryo
  # are in training, validation or test. false: frame-level split, as in
  # the first thesis version (two videos).
  group_by_sample: true
  # Without grouping only: keep the share of each video equal across
  # train / val / test.
  stratify_by_sample: true

model:
  dropout: 0.5

train:
  batch_size: 16
  epochs: 100
  learning_rate: 0.001
  # true = reshuffled every epoch, reproducibly from the seed.
  # false = the same (random) batch order in every epoch, as in the first
  # thesis version.
  shuffle: true
  # The weights of the epoch with the best validation value of `monitor` are
  # kept. Foreground IoU does not depend on the loss, so the weighted and
  # unweighted runs are selected by the same criterion.
  monitor: val_iou
  mode: max
  early_stopping:
    # false = train all `epochs` (as in the thesis), then restore the best
    # epoch. true = stop when `monitor` has not improved for `patience`
    # epochs; epochs before `start_from_epoch` are ignored (in the saved run
    # of the original notebook, not the thesis run, the validation accuracy of
    # the unweighted model only rose above the all-background level from
    # about epoch 35).
    enabled: false
    patience: 20
    start_from_epoch: 40
  tensorboard:
    enabled: true
    histogram_freq: 1

class_weighting:
  # inverse_frequency (default): w_c = N_total / (C * n_c)
  # median_frequency (SegNet):    w_c = median_freq / freq_c
  method: inverse_frequency

evaluation:
  # Fixed decision threshold on the sigmoid output.
  threshold: 0.5
  # Also pick the Dice-optimal threshold on the validation set and report
  # the test metrics at that threshold.
  tune_threshold: true
  threshold_min: 0.05
  threshold_max: 0.95
  threshold_steps: 19
  tuning_metric: dice

experiments:
  # unweighted = binary cross-entropy (thesis baseline)
  # weighted   = frequency-weighted binary cross-entropy
  # (command-line runner only; the notebook always trains both)
  runs: [unweighted, weighted]
  # Run used for the qualitative figures (predictions, confusion matrix...).
  figure_run: weighted

cross_validation:
  # Robustness check next to the main split: the embryos are shuffled
  # (seed) and dealt into `folds` groups; each group is the test set of one
  # fold, so every embryo is tested once. With folds equal to the number of
  # embryos this is leave-one-embryo-out (the two videos of the first
  # thesis version: folds 2 and split.group_by_sample false).
  enabled: true
  folds: 5
  runs: [unweighted, weighted]
